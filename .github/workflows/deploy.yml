# Deploys the toolbox to Vercel (production) on every push to main, using Chandler's Vercel token.
# Deploys made this way count as Chandler's, so pushes from collaborators aren't blocked.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_BwmyeTJ7AggKhM9lqnttO52l
  VERCEL_PROJECT_ID: prj_Amk3t380M5aUNFRygHAgLJaNM6Er

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to production
        run: vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
