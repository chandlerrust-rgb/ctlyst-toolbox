# Deploys the toolbox to Vercel (production) on every push to main, using Chandler's Vercel token.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_BwmyeTJ7AggKhM9lqnttO52l
  VERCEL_PROJECT_ID: prj_Amk3t380M5aUNFRygHAgLJaNM6Er

jobs:
  deploy:
    # Vercel's free plan only deploys changes from the account owner. Collaborator pushes are
    # saved on GitHub and go live when Chandler publishes (see CLAUDE.md, "Publishing collaborator changes").
    if: github.actor == 'chandlerrust-rgb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to production
        run: vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
