<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Get Started</title>
<meta property="og:image" content="https://www.scalewithsteelwater.com/brand/ctlyst-og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/ctlyst-icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/brand/ctlyst-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #2B3B38;
    --card: #1F302B;
    --line: #3A4D48;
    --text: #F6F4F2;
    --muted: #B8C3C0;
    --dim: #8B9A96;
    --gold: #A3B3AB;
    --gold-hi: #C4D1CA;
    --gold-deep: #7F918A;
    --display: "DM Serif Display", Georgia, "Times New Roman", serif;
    --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 40% at 50% -5%, #445C58 0%, rgba(68,92,88,0) 60%), var(--bg);
    color: var(--text); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
  }
  main { max-width: 860px; margin: 0 auto; padding-block: 22px 64px; display: grid; gap: 20px; }
  .back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: .88rem; justify-self: start; }
  .back:hover { color: var(--gold); }

  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .steps a, .steps span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 .85rem/1 var(--body); text-decoration: none;
    border: 1px solid var(--line); color: var(--muted); background: var(--card); }
  .steps a:hover { border-color: var(--gold); color: var(--gold); }
  .steps .on { background: var(--gold); border-color: var(--gold); color: #1C2826; }
  .steps span { opacity: .45; }

  .eyebrow { font: 800 .72rem/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  h1 { font: 400 clamp(2rem, 7vw, 2.8rem)/1.05 var(--display); margin: 6px 0 0; text-wrap: balance; }

  .speed { margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: .88rem; color: var(--muted);
    background: rgba(163,179,171,.1); border: 1px solid rgba(163,179,171,.4); }
  .speed svg { flex: none; width: 22px; height: 22px; color: var(--gold); }
  .speed b { color: var(--text); }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #0D1412; border: 1px solid var(--line); box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .soon { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
  .soon b { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 4px; }

  .notes { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .notes h2 { margin: 0 0 8px; font: 800 .72rem/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nav a, .nav span { display: grid; gap: 2px; padding: 14px 16px; border-radius: 12px; text-decoration: none; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .nav small { font: 800 .66rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .nav b { font-weight: 700; line-height: 1.3; }
  .nav .next { text-align: right; }
  .nav a.next { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border-color: var(--gold); color: #1C2826; box-shadow: inset 0 -2px 0 var(--gold-deep); }
  .nav a.next small { color: #2A342F; }
  .nav a:hover { border-color: var(--gold); }
  .nav span { opacity: .45; }
  .nav .ghost { visibility: hidden; }
</style>
</head>
<body>
<main>
  <a class="back" href="/chans-toolbox#start">&larr; CTLYST Toolbox</a>
  <p class="speed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l7-6-7-6z"/><path d="M12 18l7-6-7-6z"/></svg><span><b>Save time:</b> watch these on <b>1.5×</b> or <b>2×</b> speed. Tap ⚙ Settings → Playback speed in the video.</span></p>
  <div class="steps" id="steps" aria-label="Get Started steps"></div>
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
  </header>
  <div class="video" id="video"></div>
  <section class="notes" id="notes" hidden><h2>Key takeaways</h2><ul id="notelist"></ul></section>
  <nav class="nav" id="nav"></nav>
</main>

<script>
  // ===== EDIT THIS =====
  // youtube: the video ID (the part after youtu.be/). Leave "" until the video is ready.
  // notes: optional bullet points shown under the video.
  const STEPS = [
    { title: "Onboarding with Everlife", youtube: "LDDigpI9RoU", notes: [] },
    { title: "Passing the Test & Getting Your License", youtube: "45tsouE8x7w", notes: [] },
    { title: "Onboarding with Everlife, Part 2", youtube: "fZyvgBRzWv4", notes: [] },
    { title: "Carrier Contracting", youtube: "1Owej7xF4Ao", notes: [] },
    { title: "Set Up Your Tech", youtube: "q6IFw6kUpmk", notes: [] },
    { title: "Pitch Walkthrough", youtube: "", notes: [] },
    { title: "Practice E-Apps", youtube: "", notes: [] },
    { title: "Wingmans", youtube: "", notes: [] },
    { title: "Big Boy Leads & Automation", youtube: "", notes: [] },
  ];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function render() {
    let i = parseInt(location.hash.slice(1), 10) - 1;
    if (!(i >= 0 && i < STEPS.length)) i = 0;
    const s = STEPS[i];
    document.title = s.title + " · Get Started";
    document.getElementById("eyebrow").textContent = `Get Started · Step ${i + 1} of ${STEPS.length}`;
    document.getElementById("title").textContent = s.title;
    document.getElementById("steps").innerHTML = STEPS.map((x, k) =>
      x.youtube || k === i
        ? `<a href="#${k + 1}" class="${k === i ? "on" : ""}" aria-label="Step ${k + 1}: ${esc(x.title)}"${k === i ? ' aria-current="step"' : ""}>${k + 1}</a>`
        : `<span title="Coming soon">${k + 1}</span>`).join("");
    document.getElementById("video").innerHTML = s.youtube
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube)}?rel=0&modestbranding=1&playsinline=1" title="${esc(s.title)}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
      : `<div class="soon"><div><b>Video coming soon</b>This step's training is being recorded.</div></div>`;
    const notes = s.notes || [];
    document.getElementById("notes").hidden = !notes.length;
    document.getElementById("notelist").innerHTML = notes.map(n => `<li>${esc(n)}</li>`).join("");
    const prev = STEPS[i - 1], next = STEPS[i + 1];
    const link = (x, k, cls, label) => !x ? `<span class="${cls} ghost"></span>`
      : x.youtube ? `<a class="${cls}" href="#${k + 1}"><small>${label}</small><b>${esc(x.title)}</b></a>`
      : `<span class="${cls}"><small>${label} · coming soon</small><b>${esc(x.title)}</b></span>`;
    document.getElementById("nav").innerHTML = link(prev, i - 1, "prev", "← Previous") + link(next, i + 1, "next", "Next step →");
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
