<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EverLife Recruiting Deck</title>
<meta property="og:image" content="https://ctlyst-toolbox.vercel.app/brand/ctlyst-og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/ctlyst-icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/brand/ctlyst-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #2B3B38; color: #F6F4F2; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
         padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; font-size: 14px; }
  .bar a { color: #B8C3C0; text-decoration: none; font-weight: 600; }
  .bar a:hover { color: #A3B3AB; }
  .count { color: #B8C3C0; font-variant-numeric: tabular-nums; }
  .stage { position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
           top: calc(44px + env(safe-area-inset-top, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px));
           display: grid; place-items: center; padding: 0 64px; }
  .slide { grid-area: 1 / 1; max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
           opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s; user-select: none; -webkit-user-drag: none; }
  .slide.on { opacity: 1; visibility: visible; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 5; width: 44px; height: 44px; border-radius: 50%;
         border: 1px solid #3A4D48; background: rgba(31,48,43,.75); color: #F6F4F2; font-size: 22px; cursor: pointer; }
  .nav:hover { border-color: #A3B3AB; color: #A3B3AB; }
  .prev { left: 12px; } .next { right: 12px; }
  .nav:disabled { opacity: .25; cursor: default; }
  .hint { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #A3B3AB; font-size: 12px; }
  @media (hover: none) { .nav { display: none; } .stage { padding: 0 8px; } }
  @media (orientation: landscape) and (max-height: 500px) {
    .bar { padding-top: calc(4px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; font-size: 12px; background: rgba(43,59,56,.9); }
    .stage { top: calc(22px + env(safe-area-inset-top, 0px)); bottom: env(safe-area-inset-bottom, 0px); }
    .hint { display: none; }
  }
</style>
<style>h1,h2,h3{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400}</style>
</head>
<body>
  <div class="bar"><a href="/">&larr; CTLYST Toolbox</a><span class="count" id="count"></span></div>
  <div class="stage" id="stage">
    <img class="slide" src="/everlife/deck/slide-01.jpg" alt="EverLife recruiting deck, slide 1">
    <img class="slide" src="/everlife/deck/slide-02.jpg" alt="EverLife recruiting deck, slide 2">
    <img class="slide" src="/everlife/deck/slide-03.jpg" alt="EverLife recruiting deck, slide 3" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-04.jpg" alt="EverLife recruiting deck, slide 4" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-05.jpg" alt="EverLife recruiting deck, slide 5" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-06.jpg" alt="EverLife recruiting deck, slide 6" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-07.jpg" alt="EverLife recruiting deck, slide 7" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-08.jpg" alt="EverLife recruiting deck, slide 8" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-09.jpg" alt="EverLife recruiting deck, slide 9" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-10.jpg" alt="EverLife recruiting deck, slide 10" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-11.jpg" alt="EverLife recruiting deck, slide 11" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-12.jpg" alt="EverLife recruiting deck, slide 12" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-13.jpg" alt="EverLife recruiting deck, slide 13" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-14.jpg" alt="EverLife recruiting deck, slide 14" loading="lazy">
    <img class="slide" src="/everlife/deck/slide-15.jpg" alt="EverLife recruiting deck, slide 15" loading="lazy">
  </div>
  <button class="nav prev" id="prev" aria-label="Previous slide">&#8249;</button>
  <button class="nav next" id="next" aria-label="Next slide">&#8250;</button>
  <div class="hint">Swipe or tap to change slides · Turn your phone sideways for a full-screen view</div>
<script>
  const slides = [...document.querySelectorAll(".slide")];
  let i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, k) => el.classList.toggle("on", k === i));
    if (slides[i + 1]) slides[i + 1].loading = "eager";
    document.getElementById("count").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === slides.length - 1;
    history.replaceState(null, "", "#" + (i + 1));
  }
  document.getElementById("prev").onclick = () => show(i - 1);
  document.getElementById("next").onclick = () => show(i + 1);
  addEventListener("keydown", e => {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(i - 1); }
  });
  let x0 = null;
  addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
    else if (!e.target.closest("a,button")) show(i + (e.changedTouches[0].clientX > innerWidth / 2 ? 1 : -1));
  });
  show(i);
</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a');if(!a||a.getAttribute('href')!=='/'||a.textContent.indexOf('←')<0)return;if(document.referrer.indexOf(location.origin)===0&&history.length>1){e.preventDefault();history.back();}});</script>
</body>
</html>
